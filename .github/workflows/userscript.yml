name: Userscript CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Detecta si hay lockfile en la raíz
      - name: Detect lockfile
        id: lock
        run: |
          if [[ -f package-lock.json || -f npm-shrinkwrap.json || -f yarn.lock ]]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      # Configura Node SOLO si hay lockfile
      - name: Setup Node
        if: steps.lock.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # No usar cache-dependency-path cuando no estamos seguros del lockfile

      # Instala deps SOLO si hay lockfile
      - name: Install deps (only if lockfile)
        if: steps.lock.outputs.found == 'true'
        run: |
          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            npm ci || npm install
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --frozen-lockfile || yarn install
          fi

      # Resto de pasos de tu pipeline (lint/build/release), si los tienes:
      # - name: Build
      #   run: echo "No build needed for userscript"

      - name: Finish
        run: echo "CI finished"
