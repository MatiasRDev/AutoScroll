name: Userscript CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Node project
        id: has_node
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.has_node.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps (if Node)
        if: steps.has_node.outputs.present == 'true'
        run: npm ci || npm install

      - name: Run tests (if Node and tests exist)
        if: steps.has_node.outputs.present == 'true' && hashFiles('tests/**/*','test/**/*','**/*.test.*') != ''
        run: npm test

      - name: Finish
        run: echo "CI finished"
