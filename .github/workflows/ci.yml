name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only setup Node/npm if a lockfile exists
      - name: Setup Node (only if lockfile exists)
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (only if lockfile exists)
        if: hashFiles('package-lock.json') != ''
        run: npm ci || npm install

      # Minimal validation for userscript metadata
      - name: Validate userscript
        run: |
          FILE=$(ls *.user.js || true)
          if [ -z "$FILE" ]; then
            echo "No *.user.js found at repo root"; exit 1
          fi
          head -n 40 "$FILE" | grep -q "@name" || (echo "Missing @name in metadata" && exit 1)
          head -n 40 "$FILE" | grep -q "@match" || (echo "Missing @match in metadata" && exit 1)
          echo "Userscript OK ✅"
